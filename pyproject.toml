[project]
name = "medflow-ai"
version = "0.1.0"
description = "Early warning and forecasting MVP for hospital flow"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "polars>=1.0", "scikit-learn>=1.5", "sqlalchemy>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "apps/api"}

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests", "ml/tests"]
