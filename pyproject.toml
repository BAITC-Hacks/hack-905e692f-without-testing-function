[project]
name = "medflow-ai"
version = "0.1.0"
description = "Early warning and forecasting MVP for hospital flow"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.0",
  "pydantic==2.13.5",
  "argon2-cffi==25.1.0",
  "scikit-learn==1.9.0",
  "sqlalchemy==2.0.52",
  "joblib==1.6.0",
  "numpy==2.5.3",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "apps/api"}

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["app", "app.*"]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = [".", "apps/api"]
testpaths = ["apps/api/tests", "ml/tests"]
